<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="title-en" content="SterileGMP Character — Character &amp; Codex">
<title>SterileGMP Character — 角色與圖鑑</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f5f7;color:#1d1d1f;font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",system-ui,-apple-system,sans-serif;line-height:1.6;min-height:100vh}
.page-head{background:#fff;border-bottom:1px solid rgba(0,0,0,.08);padding:28px 16px;text-align:center}
.page-head h1{margin:0;font-size:28px;font-weight:700;letter-spacing:-.02em;line-height:1.2}
.page-head p{margin:6px 0 0;font-size:14px;color:#6e6e73}
.page-head nav{margin-top:10px;font-size:12px}
.page-head nav a{color:#0071e3;text-decoration:none;font-weight:500}
.page-head nav span{color:#aeaeb2;margin:0 6px}
.off{position:relative;max-width:1040px;margin:32px auto;display:grid;grid-template-columns:minmax(0,46%) minmax(0,1fr);align-items:center;overflow:hidden;color:#fff;border:2px solid #14151a;border-radius:18px;box-shadow:6px 6px 0 #14151a;background:radial-gradient(120% 90% at 22% 100%,rgba(255,61,129,.35),transparent 60%),linear-gradient(115deg,#14151a 0%,#23252d 60%,#3a2350 120%)}
.off-wrap{padding:0 16px}
.off-cast{position:relative;height:320px;align-self:end}
.off-cast img{position:absolute;bottom:-6px;width:auto;filter:drop-shadow(0 6px 10px rgba(0,0,0,.5))}
.off-cast .c0{left:2%;height:66%;opacity:.8}.off-cast .c1{left:50%;transform:translateX(-50%);height:96%;z-index:2}.off-cast .c2{right:2%;height:66%;opacity:.8}
.off-body{padding:32px 34px 32px 8px}
.off-tag{display:inline-block;font-size:11px;font-weight:800;font-style:italic;letter-spacing:.14em;color:#14151a;background:#ffd23f;padding:2px 12px 2px 10px;clip-path:polygon(0 0,100% 0,calc(100% - 8px) 100%,0 100%)}
.off h2{margin:12px 0 0;font-size:28px;font-weight:900;font-style:italic;line-height:1.25}
.off p{margin:10px 0 0;color:#c9ccd6;font-size:15px;max-width:46ch}
.off a{display:inline-block;margin-top:22px;background:#ff3d81;color:#fff;text-decoration:none;font-weight:700;font-size:16px;padding:12px 26px;border:2px solid #14151a;border-radius:8px;box-shadow:3px 3px 0 #000}
.off a:hover{transform:translate(-1px,-1px)}
@media (max-width:720px){.off{grid-template-columns:1fr}.off-cast{height:220px}.off-body{padding:6px 20px 24px}.off h2{font-size:23px}}
.page-foot{text-align:center;font-size:12px;color:#aeaeb2;padding:24px 16px 32px}
</style>
</head>
<body>

<header class="page-head">
    <h1>SterileGMP Character</h1>
    <p data-en="Character, companion and document card collection">角色、夥伴與文件卡圖鑑</p>
    <nav>
        <a href="index.html">Dashboard</a><span>·</span>
        <a href="learning-path.html">Learning Path</a><span>·</span>
        <a href="mindmap.html">Mind Map</a><span>·</span>
        <a href="quiz.html">Quiz Tracker</a><span>·</span>
        <a href="map.html">Map</a>
    </nav>
</header>

<main id="rpg-character">
    <!-- Replaced by rpg/rpg.js when the learning-adventure mode is switched on -->
    <div class="off-wrap"><div class="off">
        <div class="off-cast" aria-hidden="true"><img class="c0" src="rpg/assets/class-qa.webp" alt=""><img class="c1" src="rpg/assets/class-production-3.webp" alt=""><img class="c2" src="rpg/assets/class-engineering.webp" alt=""></div>
        <div class="off-body">
        <span class="off-tag">ADVENTURE</span>
        <h2 data-en="Adventure mode is off">學習冒險模式尚未開啟</h2>
        <p data-en="Turn it on and reading sections and passing section challenges earn XP, document cards and a companion. Your character and progress are stored only in this device's browser.">開啟後，閱讀章節和通過章節挑戰會累積經驗值、文件卡和夥伴。角色和進度只存在這台裝置的瀏覽器裡。</p>
        <a href="character.html?rpg=1" data-en="Start adventure mode">開啟學習冒險模式</a>
        </div>
    </div></div>
</main>

<footer class="page-foot" data-en="SterileGMP Knowledge Hub · Character data stays in your browser">SterileGMP Knowledge Hub · 角色資料只存在你的瀏覽器</footer>

<script>
/* English UI when the adventure language is set to English (sgk_rpg_lang). */
(function () {
  try { if (localStorage.getItem('sgk_rpg_lang') !== 'en') return; } catch (e) { return; }
  document.documentElement.lang = 'en';
  var t = document.querySelector('meta[name="title-en"]'); if (t) document.title = t.content;
  document.querySelectorAll('[data-en]').forEach(function (el) { el.textContent = el.getAttribute('data-en'); });
})();
</script>
<script src="rpg/rpg.js" defer></script>
</body>
</html>
